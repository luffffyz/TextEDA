# TextEDA project file
# Required fields generated by `texteda init`; the rest are metadata examples for this reference project, edit as needed.
# `format` is the TextEDA format version, maintained by the tools; do not edit it by hand.
# The reference project uses the 0.3 `page` description kind and the `pages` section; description files
# that do not use the new constructs (all of components/) keep their own older versions.

[project]
name = "reference-project"
version = "0.1.0"
format = "0.3"
description = "Reference project for TextEDA"
license = "CERN-OHL-S-2.0"   # SPDX identifier
status = "draft"             # draft / prototype / frozen / production / deprecated
default_variant = "default"

[[project.authors]]
name = "TextEDA"

[project.links]
repository = "https://example.com/reference-project"

# Board list: the id maps to sch/<id>.teda and pcb/<id>.teda (the pcb may come later).
[boards.charger-buck]
revision = "A"
title = "Charger + 5V buck"

[boards.mcu-board]
revision = "A"
title = "CH32V307 MCU minimum system board"

[variants.default]
description = "fully populated"

# Variant example: components are referenced by stable component_id, not refdes.
# [variants.lite]
# dnp = ["comp_c7", "comp_c8"]
# nofit = ["comp_u3"]

# Library lock: everything in this project is self-built — components, symbols and footprints all live in the repo; no external libraries.
# Self-built libraries have no upstream rev, so a content hash anchors the version (ADR-0010; recompute: bun run lib:hash symbols/project footprints/project).
[libs.project]
source = "project"
symbols = "symbols/project"
footprints = "footprints/project"
content_hash = "4db4c10efc4f227f77e796b56941962f61a1b1570a870b269a46133fdbb3bca0"

# Compliance targets: for the review/certification checklist.
[compliance]
standards = ["CE", "RoHS"]
operating_temp = "0C..40C"

# The only free-form extension area; unknown top-level keys are errors.
[ext]
